[project]
name = "relay-engine"
version = "0.2.0"
description = "Moteur de migration et de réconciliation de données"
authors = [{ name = "bstcoc", email = "bastien.cochet@epitech.eu" }]
requires-python = ">=3.14"
dependencies = [
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
    "typer>=0.27.2",
]

[project.scripts]
relay = "relay_engine.cli:main"
relay-service = "relay_engine.service:main"

[project.optional-dependencies]
databases = [
    "connectorx>=0.4.6",
    "paramiko>=5.0.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pymssql>=2.4.2",
    "pymysql>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "nuitka>=4.2.2",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
